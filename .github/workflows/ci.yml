name: Static workflow and skill checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check 75-grid workflow JSON
        run: python scripts/check_depth75.py
      - name: Test repository package
        run: python -m unittest discover -s tests -v
      - name: Test Creator Skill
        run: python -m unittest discover -s skills/qwen-image-2-1-creator/tests -v
